name: Deploy factorio server
on: [push]

jobs:
  BuildAndPushContainer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: CheckOut
        uses: actions/checkout@v5
        
      - name: Dockerfile
        run: |
          docker build -t ci_factorio .

      - name: Docker run
        run: |
          docker run -d --name factorio -e EULA=true --rm ci_factorio
          docker rm -f factorio 

