name: Deploy factorio server
on: [push]

jobs:
  BuildAndPushContainer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: CheckOut
        uses: actions/checkout@v5
        
      - name: Dockerfile
        run: |
          
          docker build --build-arg VER=$(cat VERSION) -t ci_factorio .

      - name: Docker run
        run: |
          docker run -d -p 34197:34197/udp --name factorio --rm ci_factorio

      - name: Wait for server to start
        run: |
          i=1
          while [ $i -ne 12 ]; do
            if ss -uln | grep -q ":34197 " && docker logs factorio 2>&1 | grep -q "Factorio initialised"; then
              break
            else
              sleep 5; i=$(($i + 1))
            fi
          done
          if [ $i = 12 ]; then docker rm -f factorio; exit 1; fi

      - name: Check save file was created
        run: |
          docker exec factorio test -f /factorio/saves/save.zip
          result=$?
          docker rm -f factorio
          exit $result

      - name: Push to GitHub Container Registry
        run: |
          VERSION=$(cat VERSION)
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag ci_factorio ghcr.io/${{ github.repository_owner }}/factorio-server:latest
          docker tag ci_factorio ghcr.io/${{ github.repository_owner }}/factorio-server:$VERSION
          docker push ghcr.io/${{ github.repository_owner }}/factorio-server:$VERSION
          docker push ghcr.io/${{ github.repository_owner }}/factorio-server:latest